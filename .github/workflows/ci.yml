# Перевірки на кожен push і PR.
#
# checks — без секретів: лінтер, типи, юніт-тести.
# e2e — продакшн-збірка й Playwright. Секрети вказують на окрему гілку Neon
# (лише схема, без даних клієнтів) і на тестовий інстанс Clerk — продакшн-база
# й справжні акаунти сюди не потрапляють.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CI_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CI_CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Тестові акаунти адмінки — нові на кожен запуск, живуть лише в цьому прогоні.
      # База — тестова гілка ci, тож e2e адмінки (E2E_ADMIN=1) може в неї писати.
      - name: Тестові акаунти адмінки
        run: |
          {
            echo "E2E_ADMIN=1"
            echo "ADMIN_SESSION_SECRET=$(openssl rand -hex 32)"
            echo "ADMIN_EMAIL=e2e-owner@example.com"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "ADMIN_NAME=Власник"
            echo "ADMIN_TOTP_SECRET=$(python3 -c 'import base64,os;print(base64.b32encode(os.urandom(20)).decode())')"
            echo "ADMIN_EMAIL_2=e2e-master@example.com"
            echo "ADMIN_PASSWORD_2=$(openssl rand -hex 16)"
            echo "ADMIN_NAME_2=Майстер"
          } >> "$GITHUB_ENV"
      # Збірку робить сам Playwright (webServer у playwright.config.ts)
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
